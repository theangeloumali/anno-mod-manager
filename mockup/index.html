<!doctype html>
<html lang="en" data-game="a117">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier Mod Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Cinzel:wght@500;600&family=Libre+Franklin:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens: one system, two skins. Lena lifts these into the React theme. */
      :root {
        --ok: #74c27a;
        --warn: #e6b64a;
        --err: #ef6d5e;
        --info: #74ade3;
        --font-body: "Libre Franklin", "Franklin Gothic Book", "Segoe UI", system-ui, sans-serif;
        --font-data: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
        --radius-control: 6px;
        --radius-panel: 10px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        --sidebar-w: 232px;
        --detail-w: 360px;
      }
      [data-game="a117"] {
        --ground: #15110e;
        --surface: #1d1813;
        --raised: #272019;
        --line: #3b3027;
        --line-strong: #54453a;
        --text: #efe6d8;
        --muted: #b9aa94;
        --accent: #e07a4f;
        --accent-ink: #1a0f09;
        --accent-soft: rgba(224, 122, 79, 0.14);
        --accent-2: #a98bd0;
        --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
        --display-tracking: 0.06em;
      }
      [data-game="a1800"] {
        --ground: #0d1316;
        --surface: #141c20;
        --raised: #1b262b;
        --line: #2a383e;
        --line-strong: #3d5058;
        --text: #e5ecea;
        --muted: #a3b3b2;
        --accent: #d3a64c;
        --accent-ink: #171106;
        --accent-soft: rgba(211, 166, 76, 0.14);
        --accent-2: #4fb3ab;
        --font-display: "Bodoni Moda", "Didot", Georgia, serif;
        --display-tracking: 0.01em;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--ground);
        color: var(--text);
        font: 400 14px/1.5 var(--font-body);
        -webkit-font-smoothing: antialiased;
        transition: background-color 160ms ease;
        overflow: hidden;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--line-strong) transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line-strong);
        border-radius: 10px;
        border: 3px solid var(--surface);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        caret-color: var(--accent);
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      svg.i {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .data {
        font-family: var(--font-data);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* App frame */
      .app {
        display: grid;
        grid-template-columns: var(--sidebar-w) 1fr;
        grid-template-rows: 44px 1fr 30px;
        grid-template-areas: "title title" "side main" "status status";
        height: 100vh;
      }
      .titlebar {
        grid-area: title;
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: 0 var(--space-2) 0 var(--space-4);
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-weight: 600;
        font-size: 16px;
        white-space: nowrap;
      }
      .brand small {
        font-family: var(--font-body);
        letter-spacing: 0;
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
      }
      .game-switch {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--ground);
      }
      .game-switch button {
        border: 0;
        background: none;
        padding: 4px 12px;
        border-radius: var(--radius-control);
        color: var(--muted);
        font-weight: 500;
        font-size: 13px;
        transition:
          background-color 120ms ease,
          color 120ms ease;
      }
      .game-switch button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .game-switch button:not([aria-pressed="true"]):hover {
        color: var(--text);
      }
      .title-spacer {
        flex: 1;
      }
      .win-controls {
        display: flex;
      }
      .win-controls button {
        width: 40px;
        height: 32px;
        border: 0;
        background: none;
        color: var(--muted);
        border-radius: var(--radius-control);
      }
      .win-controls button:hover {
        background: var(--raised);
        color: var(--text);
      }

      .sidebar {
        grid-area: side;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--surface);
        min-height: 0;
      }
      .ornament {
        height: 10px;
        margin: var(--space-3) var(--space-4) var(--space-2);
        color: var(--line-strong);
      }
      .ornament svg {
        width: 100%;
        height: 10px;
        display: block;
      }
      .nav {
        list-style: none;
        margin: 0;
        padding: var(--space-2);
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .nav-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: var(--space-4) var(--space-3) var(--space-1);
      }
      .nav button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 7px var(--space-3);
        border: 0;
        background: none;
        border-radius: var(--radius-control);
        color: var(--muted);
        text-align: left;
        font-weight: 500;
        transition:
          background-color 120ms ease,
          color 120ms ease;
      }
      .nav button:hover {
        background: var(--raised);
        color: var(--text);
      }
      .nav button[aria-current="page"] {
        background: var(--accent-soft);
        color: var(--text);
      }
      .nav button[aria-current="page"] svg {
        color: var(--accent);
      }
      .nav .count {
        margin-left: auto;
        font: 500 11px var(--font-data);
        color: var(--muted);
      }
      .nav .count.warn {
        color: var(--warn);
      }
      .nav .count.err {
        color: var(--err);
      }
      .launch {
        margin-top: auto;
        padding: var(--space-4);
        border-top: 1px solid var(--line);
      }
      .btn-launch {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        transition:
          filter 120ms ease,
          transform 160ms var(--ease-out);
      }
      .btn-launch:hover {
        filter: brightness(1.08);
      }
      .btn-launch[disabled] {
        background: var(--raised);
        color: var(--muted);
        cursor: not-allowed;
        filter: none;
      }
      .launch-meta {
        margin-top: var(--space-2);
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .launch-meta.err {
        color: var(--err);
      }

      .main {
        grid-area: main;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
      }
      .view.on {
        display: flex;
      }
      .view-head {
        display: flex;
        align-items: flex-end;
        gap: var(--space-4);
        padding: var(--space-5) var(--space-5) var(--space-4);
        flex-wrap: wrap;
      }
      .view-head h1 {
        margin: 0;
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-weight: 600;
        font-size: 24px;
        line-height: 1.15;
      }
      .view-head p {
        margin: 4px 0 0;
        color: var(--muted);
        max-width: 68ch;
      }
      .view-head .actions {
        margin-left: auto;
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        align-items: center;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 var(--space-5) var(--space-5);
      }

      /* Controls */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        padding: 7px 12px;
        border-radius: var(--radius-control);
        border: 1px solid var(--line-strong);
        background: var(--raised);
        font-weight: 500;
        font-size: 13px;
        white-space: nowrap;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          transform 160ms var(--ease-out);
      }
      .btn:hover {
        border-color: var(--muted);
      }
      .btn:active:not([disabled]),
      .btn-launch:active:not([disabled]),
      .chip:active,
      .auth-option:active {
        transform: scale(0.97);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.ghost {
        background: none;
        border-color: transparent;
        color: var(--muted);
      }
      .btn.ghost:hover {
        color: var(--text);
        background: var(--raised);
      }
      .btn.danger {
        color: var(--err);
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn svg.i {
        width: 16px;
        height: 16px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 0 10px;
        height: 34px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-control);
        background: var(--ground);
        min-width: 0;
      }
      .field:focus-within {
        border-color: var(--accent);
      }
      .field input,
      .field select {
        border: 0;
        background: none;
        outline: none;
        min-width: 0;
        flex: 1;
        height: 100%;
      }
      .field input::placeholder {
        color: var(--muted);
      }
      .field select option {
        background: var(--surface);
      }
      .field svg.i {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: none;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        transition:
          border-color 120ms ease,
          color 120ms ease,
          transform 160ms var(--ease-out);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--text);
        background: var(--accent-soft);
      }
      .chip .n {
        font-family: var(--font-data);
        margin-left: 4px;
      }
      .toggle {
        position: relative;
        width: 34px;
        height: 20px;
        flex: none;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--ground);
        padding: 0;
        transition:
          background-color 120ms ease,
          border-color 120ms ease;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--muted);
        transition: transform 160ms var(--ease-out);
      }
      .toggle[aria-checked="true"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .toggle[aria-checked="true"]::after {
        transform: translateX(14px);
        background: var(--accent-ink);
      }
      .toggle[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Stamps: states as small-caps outlined marks */
      .stamp {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 6px;
        border: 1px solid currentColor;
        border-radius: 4px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        line-height: 1.5;
      }
      .stamp.ok {
        color: var(--ok);
      }
      .stamp.warn {
        color: var(--warn);
      }
      .stamp.err {
        color: var(--err);
      }
      .stamp.info {
        color: var(--info);
      }
      .stamp.accent {
        color: var(--accent);
      }
      .stamp.late {
        color: var(--accent-2);
      }
      .stamp.dim {
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--muted);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.err {
        background: var(--err);
      }

      /* Library */
      .lib {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr var(--detail-w);
      }
      .lib-list {
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: 0 var(--space-5) var(--space-3);
        flex-wrap: wrap;
      }
      .toolbar .field.search {
        flex: 1 1 220px;
      }
      .ledger {
        width: 100%;
        border-collapse: collapse;
      }
      .ledger th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--ground);
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 8px 10px;
        border-bottom: 1px solid var(--line-strong);
      }
      .ledger td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .ledger tr.row {
        cursor: pointer;
      }
      .ledger tr.row:hover td {
        background: var(--surface);
      }
      .ledger tr.row[aria-selected="true"] td {
        background: var(--accent-soft);
      }
      .ledger tr.row.off .mod-name {
        color: var(--muted);
      }
      .ledger .num {
        text-align: right;
      }
      .mod-name {
        font-weight: 500;
      }
      .mod-cat {
        color: var(--muted);
        font-size: 12px;
        margin-right: 6px;
      }
      .mod-id {
        color: var(--muted);
        display: block;
        margin-top: 1px;
      }
      .state-cell {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .lib-stats {
        padding: var(--space-3) var(--space-5);
        border-top: 1px solid var(--line);
        display: flex;
        gap: var(--space-5);
        color: var(--muted);
        font-size: 12px;
        flex-wrap: wrap;
      }
      .lib-stats b {
        color: var(--text);
        font-weight: 500;
        font-family: var(--font-data);
      }

      .detail {
        border-left: 1px solid var(--line);
        background: var(--surface);
        overflow-y: auto;
        min-height: 0;
      }
      .banner {
        aspect-ratio: 16/9;
        background: linear-gradient(
            160deg,
            transparent 40%,
            rgba(0, 0, 0, 0.55)
          ),
          linear-gradient(135deg, var(--accent-soft), var(--raised) 70%);
        display: flex;
        align-items: flex-end;
        padding: var(--space-4);
        border-bottom: 1px solid var(--line);
      }
      .banner .initials {
        font-family: var(--font-display);
        font-size: 44px;
        letter-spacing: var(--display-tracking);
        color: var(--accent);
        opacity: 0.85;
        line-height: 1;
      }
      .detail-body {
        padding: var(--space-4) var(--space-5) var(--space-5);
      }
      .detail h2 {
        margin: 0;
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-size: 19px;
        font-weight: 600;
        line-height: 1.25;
      }
      .detail .byline,
      .byline {
        margin: 2px 0 var(--space-3);
        color: var(--muted);
        font-size: 13px;
      }
      .detail h3,
      .label-h {
        margin: var(--space-5) 0 var(--space-2);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .detail p {
        margin: 0 0 var(--space-2);
        max-width: 65ch;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px var(--space-4);
        font-size: 13px;
        margin: 0;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        word-break: break-all;
      }
      .dep-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dep-list li {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: 13px;
      }
      .dep-list .kind {
        margin-left: auto;
      }
      .callout {
        display: flex;
        gap: var(--space-3);
        padding: var(--space-3);
        border-radius: 8px;
        background: var(--raised);
        font-size: 13px;
        margin-bottom: var(--space-2);
      }
      .callout svg.i {
        margin-top: 1px;
      }
      .callout.err svg {
        color: var(--err);
      }
      .callout.warn svg {
        color: var(--warn);
      }
      .callout.info svg {
        color: var(--info);
      }
      .callout-actions {
        margin-top: var(--space-2);
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }
      .detail-actions {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        margin-top: var(--space-5);
      }

      /* Empty state */
      .empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
      }
      .drop-cta {
        width: min(560px, 100%);
        text-align: center;
        padding: 48px var(--space-6);
        border: 1.5px dashed var(--line-strong);
        border-radius: 14px;
      }
      .drop-cta svg.i {
        width: 40px;
        height: 40px;
        color: var(--accent);
      }
      .drop-cta h2 {
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        margin: var(--space-3) 0 var(--space-2);
        font-size: 22px;
        font-weight: 600;
      }
      .drop-cta p {
        color: var(--muted);
        margin: 0 auto var(--space-5);
        max-width: 46ch;
        overflow-wrap: anywhere;
      }
      .drop-cta .row-actions {
        display: flex;
        gap: var(--space-2);
        justify-content: center;
        flex-wrap: wrap;
      }

      /* Load order */
      .phase {
        margin-bottom: var(--space-6);
      }
      .phase-head {
        display: flex;
        align-items: baseline;
        gap: var(--space-3);
        padding-bottom: var(--space-2);
        border-bottom: 1px solid var(--line-strong);
        margin-bottom: var(--space-2);
      }
      .phase-head h2 {
        margin: 0;
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-size: 17px;
        font-weight: 600;
      }
      .order-row {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: var(--space-3);
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .order-row .pos {
        font: 500 13px var(--font-data);
        color: var(--muted);
        text-align: right;
      }
      .why {
        font-size: 12px;
        color: var(--muted);
      }
      .why b {
        color: var(--text);
        font-weight: 500;
      }

      /* Browse grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: var(--space-4);
      }
      .tile {
        text-align: left;
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        background: var(--surface);
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: border-color 120ms ease;
      }
      .tile:hover {
        border-color: var(--line-strong);
      }
      .tile .thumb {
        aspect-ratio: 16/9;
        background: linear-gradient(
          135deg,
          var(--accent-soft),
          var(--raised) 75%
        );
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: var(--space-2) var(--space-3);
      }
      .tile .thumb .initials {
        font-family: var(--font-display);
        font-size: 28px;
        color: var(--accent);
        opacity: 0.8;
        letter-spacing: var(--display-tracking);
      }
      .tile .meta {
        padding: var(--space-3);
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        width: 100%;
      }
      .tile .meta strong {
        font-weight: 600;
        line-height: 1.3;
      }
      .tile .meta .row {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: auto;
        padding-top: var(--space-2);
      }
      .tile .meta .row svg.i {
        width: 14px;
        height: 14px;
      }
      .tile .meta .row span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .powered {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .banner-state {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        margin: 0 var(--space-5) var(--space-4);
        padding: var(--space-3) var(--space-4);
        border-radius: 8px;
        background: var(--raised);
        font-size: 13px;
      }
      .banner-state svg.i {
        color: var(--warn);
      }
      .banner-state .btn {
        margin-left: auto;
      }

      /* Drawer + dialogs */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
        z-index: 40;
      }
      .scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(520px, 100vw);
        background: var(--surface);
        border-left: 1px solid var(--line-strong);
        z-index: 41;
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 280ms var(--ease-drawer),
          visibility 0s linear 280ms;
        display: flex;
        flex-direction: column;
      }
      .drawer.on {
        transform: none;
        visibility: visible;
        transition: transform 280ms var(--ease-drawer);
      }
      .drawer-head {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-5);
        border-bottom: 1px solid var(--line);
      }
      .drawer-head h2 {
        margin: 0;
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-size: 19px;
        font-weight: 600;
        flex: 1;
        line-height: 1.25;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-5);
      }
      .drawer-foot {
        padding: var(--space-4) var(--space-5);
        border-top: 1px solid var(--line);
        display: flex;
        gap: var(--space-2);
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .gallery {
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 6px;
        aspect-ratio: 2/1;
        margin-bottom: var(--space-4);
      }
      .gallery div {
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-soft), var(--raised));
      }
      .gallery div:first-child {
        grid-row: span 2;
      }

      /* Drop target: the one authored motion moment */
      .dropzone {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(6px);
        clip-path: inset(46% 46% 46% 46% round 24px);
        opacity: 0;
        pointer-events: none;
        transition:
          clip-path 280ms var(--ease-out),
          opacity 180ms ease;
      }
      .dropzone.on {
        clip-path: inset(0 0 0 0 round 0);
        opacity: 1;
        pointer-events: auto;
      }
      .dropzone-inner {
        width: min(640px, calc(100vw - 48px));
        padding: 56px var(--space-6);
        border: 2px dashed var(--accent);
        border-radius: 18px;
        text-align: center;
        background: var(--surface);
      }
      .dropzone-inner svg.i {
        width: 48px;
        height: 48px;
        color: var(--accent);
      }
      .dropzone-inner h2 {
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-size: 26px;
        margin: var(--space-3) 0 var(--space-2);
        font-weight: 600;
      }
      .dropzone-inner p {
        color: var(--muted);
        margin: 0 auto;
        max-width: 52ch;
      }

      dialog {
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: var(--surface);
        color: var(--text);
        padding: 0;
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.6);
      }
      dialog[open] {
        display: flex;
        flex-direction: column;
      }
      .dlg-body {
        overflow-y: auto;
        padding: var(--space-5);
      }
      .dlg-body > p {
        margin-top: 0;
        max-width: 65ch;
      }
      .preview-item {
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        padding: var(--space-4);
        margin-bottom: var(--space-3);
      }
      .preview-item header {
        display: flex;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .preview-item header .grow {
        flex: 1;
        min-width: 0;
      }
      .preview-checks {
        list-style: none;
        margin: var(--space-3) 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 6px var(--space-4);
        font-size: 13px;
      }
      .preview-checks li {
        display: flex;
        gap: var(--space-2);
        align-items: flex-start;
      }
      .preview-checks svg.i {
        width: 16px;
        height: 16px;
        margin-top: 2px;
      }
      .ic-ok {
        color: var(--ok);
      }
      .ic-warn {
        color: var(--warn);
      }
      .ic-err {
        color: var(--err);
      }

      /* Queue */
      .queue-row {
        display: grid;
        grid-template-columns: 1fr 200px auto;
        gap: var(--space-4);
        align-items: center;
        padding: var(--space-3) 0;
        border-bottom: 1px solid var(--line);
      }
      .bar {
        height: 6px;
        border-radius: 6px;
        background: var(--raised);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 6px;
        transform-origin: left;
        transition: transform 400ms linear;
      }
      .bar.err span {
        background: var(--err);
      }
      .bar.ok span {
        background: var(--ok);
      }

      /* Tweaks */
      .tweak-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: var(--space-5);
        align-items: start;
      }
      .tweak-mods {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: sticky;
        top: 0;
      }
      .tweak-mods button {
        text-align: left;
        border: 0;
        background: none;
        padding: 8px 10px;
        border-radius: var(--radius-control);
        color: var(--muted);
        white-space: nowrap;
      }
      .tweak-mods button:hover {
        color: var(--text);
      }
      .tweak-mods button[aria-current="true"] {
        background: var(--accent-soft);
        color: var(--text);
      }
      details.group {
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        margin-bottom: var(--space-3);
        background: var(--surface);
      }
      details.group summary {
        cursor: pointer;
        padding: var(--space-3) var(--space-4);
        font-weight: 600;
        list-style: none;
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      details.group summary::-webkit-details-marker {
        display: none;
      }
      details.group summary svg {
        transition: transform 160ms var(--ease-out);
      }
      details.group[open] summary svg {
        transform: rotate(90deg);
      }
      .opt {
        display: grid;
        grid-template-columns: 1fr 260px auto;
        gap: var(--space-4);
        align-items: center;
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--line);
      }
      .opt label {
        font-weight: 500;
      }
      .opt .hint {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      .opt input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      .opt input[type="color"] {
        width: 44px;
        height: 30px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-control);
        background: none;
        padding: 2px;
      }
      .modified {
        color: var(--accent);
        font-size: 11px;
        margin-left: 6px;
      }

      /* Health */
      .health-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-5);
        align-items: start;
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        background: var(--surface);
        min-width: 0;
      }
      .panel > h2 {
        margin: 0;
        padding: var(--space-3) var(--space-4);
        font-size: 13px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }
      .check-row,
      .log-row {
        display: flex;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        align-items: flex-start;
      }
      .check-row:last-child,
      .log-row:last-child {
        border-bottom: 0;
      }
      .check-row .grow,
      .log-row .grow {
        flex: 1;
        min-width: 0;
      }
      .log-row code,
      .check-row code {
        font-family: var(--font-data);
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      pre.raw {
        margin: 0;
        padding: var(--space-4);
        font: 12px/1.6 var(--font-data);
        color: var(--muted);
        overflow: auto;
        max-height: 240px;
        white-space: pre;
      }

      /* Settings */
      .settings {
        max-width: 860px;
      }
      .set-section {
        padding: var(--space-5) 0;
        border-bottom: 1px solid var(--line);
      }
      .set-section h2 {
        margin: 0 0 var(--space-1);
        font-family: var(--font-display);
        letter-spacing: var(--display-tracking);
        font-size: 17px;
        font-weight: 600;
      }
      .set-section > p {
        margin: 0 0 var(--space-4);
        color: var(--muted);
        max-width: 68ch;
      }
      .set-row {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: var(--space-4);
        align-items: center;
        padding: var(--space-2) 0;
      }
      .set-row > span {
        font-weight: 500;
      }
      .set-row .hint {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
      }
      .path-row {
        display: flex;
        gap: var(--space-2);
        align-items: center;
        min-width: 0;
      }
      .path-row .field {
        flex: 1;
      }
      .radio-row {
        display: flex;
        gap: var(--space-4);
        flex-wrap: wrap;
      }
      .radio-row label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .radio-row input {
        accent-color: var(--accent);
      }
      .account {
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        padding: var(--space-4);
        background: var(--surface);
      }
      .account-row {
        display: flex;
        gap: var(--space-4);
        align-items: center;
        flex-wrap: wrap;
      }
      .account-row .grow {
        flex: 1;
        min-width: 180px;
      }
      .account p {
        margin: 6px 0 12px;
        color: var(--muted);
        max-width: 65ch;
      }
      .code-inputs {
        display: flex;
        gap: 6px;
        margin: 14px 0;
      }
      .code-inputs input {
        width: 40px;
        height: 46px;
        text-align: center;
        font: 500 20px var(--font-data);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-control);
        background: var(--ground);
        outline: none;
      }
      .auth-options {
        display: grid;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }
      .auth-option {
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
        text-align: left;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--ground);
        transition:
          border-color 120ms ease,
          transform 160ms var(--ease-out);
      }
      .auth-option:hover {
        border-color: var(--accent);
      }
      .auth-option strong {
        display: block;
      }
      .auth-option span {
        color: var(--muted);
        font-size: 12px;
      }
      .btn-row {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      /* Wizard */
      .steps {
        display: flex;
        gap: var(--space-2);
        padding: var(--space-4) var(--space-5) 0;
        list-style: none;
        margin: 0;
      }
      .steps li {
        flex: 1;
        height: 3px;
        border-radius: 3px;
        background: var(--line);
      }
      .steps li.done {
        background: var(--accent);
      }
      .found {
        display: flex;
        gap: var(--space-3);
        align-items: center;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: var(--space-2);
      }
      .found .grow {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      /* Status bar + toasts */
      .statusbar {
        grid-area: status;
        display: flex;
        align-items: center;
        gap: var(--space-5);
        padding: 0 var(--space-4);
        border-top: 1px solid var(--line);
        background: var(--surface);
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .statusbar .item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .statusbar svg.i {
        width: 14px;
        height: 14px;
      }
      .statusbar button {
        border: 0;
        background: none;
        color: inherit;
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .statusbar button:hover {
        color: var(--text);
        background: var(--raised);
      }
      .statusbar .err-link {
        color: var(--err);
      }
      .statusbar .push {
        margin-left: auto;
      }
      .mock-menu {
        position: fixed;
        right: 12px;
        bottom: 38px;
        z-index: 70;
        width: 300px;
        padding: var(--space-3);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-panel);
        background: var(--raised);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        display: none;
      }
      .mock-menu.on {
        display: block;
      }
      .mock-menu h3 {
        margin: 0 0 var(--space-2);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .mock-menu label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        font-size: 13px;

        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }
      .toasts {
        position: fixed;
        right: 16px;
        bottom: 44px;
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
        min-width: 280px;
        max-width: 380px;
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-panel);
        background: var(--raised);
        font-size: 13px;

        transition:
          opacity 240ms ease,
          transform 240ms var(--ease-out);

      .toast svg.i {
        color: var(--ok);

      .toast.warn svg.i {
        color: var(--warn);
      }
      .toast.err svg.i {
        color: var(--err);

          height: auto;

          padding: var(--space-2) var(--space-4);
          gap: var(--space-2);

        }

          overflow-x: auto;
        }
        .ornament,
        .nav-label {
          display: none;
        }
        .nav {
          flex-direction: row;
          overflow-x: auto;
        }
        .nav button {
          white-space: nowrap;
        }
        .launch {
          margin: 0;
          padding: var(--space-2) var(--space-4) var(--space-3);
          border-top: 0;
        }
        .main {
          overflow: visible;
        }
        .scroll {
          overflow: visible;
          padding: 0 var(--space-4) var(--space-5);
        }
        .view-head {
          padding: var(--space-4) var(--space-4) var(--space-3);
        }
        .view-head .actions {
          margin-left: 0;
        }
        .toolbar {
          padding: 0 var(--space-4) var(--space-3);
        }
        .lib {

        }
        .detail {

          gap: var(--space-2);

        .set-row {

        .queue-row {

          gap: var(--space-2);
        }
        .statusbar {

        }
        .banner-state .btn {
          margin-left: 0;
        }
        .lib-stats {
          padding: var(--space-3) var(--space-4);
        }
      }

      // Mirrors the loader's own rules so the UI never disagrees with the game.
      function issuesFor(mod) {
        if (!mod.active) return [];
        const issues = [];
        const installedIds = new Set(installedMods().map((m) => m.id));
        const activeIds = new Set(
          installedMods()
            .filter((m) => m.active)
            .map((m) => m.id),
        );
        (mod.requires || []).forEach((dep) => {
          if (!installedIds.has(dep))
            issues.push({
              level: "err",
              kind: "missing",
              dep,
              text: `Requires ${dep}, which isn't installed.`,
            });
          else if (!activeIds.has(dep))
            issues.push({
              level: "err",
              kind: "inactive",
              dep,
              text: `Requires ${modLabel(dep)}, which is turned off.`,
            });
        });
        (mod.incompatible || []).forEach((dep) => {
          if (activeIds.has(dep))
            issues.push({
              level: "err",
              kind: "incompatible",
              dep,
              text: `Incompatible with ${modLabel(dep)}, and both are active.`,
            });
        });
        installedMods().forEach((other) => {
          if (!other.active) return;
          if ((other.incompatible || []).includes(mod.id))
            issues.push({
              level: "err",
              kind: "incompatible",
              dep: other.id,
              text: `${other.name} lists this mod as incompatible.`,
            });
          if ((other.deprecates || []).includes(mod.id))
            issues.push({
              level: "warn",
              kind: "deprecated",
              dep: other.id,
              text: `Replaced by ${other.name}. It won't load while that mod is active.`,
            });
        });
        if (mod.dlc)
          issues.push({
            level: "warn",
            kind: "dlc",
            text: `Needs DLC: ${mod.dlc}.`,
          });
        return issues;
      }
      const allIssues = () =>
        installedMods().flatMap((mod) =>
          issuesFor(mod).map((issue) => ({ ...issue, mod })),
        );
      const errorCount = () =>
        allIssues().filter((issue) => issue.level === "err").length;

      // Normal phase then late (`*`); LoadAfter resolved depth-first. Cycles are reported, never silently broken.
      function computeLoadOrder() {
        const active = installedMods().filter((mod) => mod.active);
        const activeIds = new Set(active.map((mod) => mod.id));
        const sortKey = (mod) => `[${mod.cat}] ${mod.name}`;
        const phases = { normal: [], late: [] };
        const cycles = [];
        ["normal", "late"].forEach((phase) => {
          const members = active
            .filter(
              (mod) =>
                (phase === "late") === (mod.loadAfter || []).includes("*"),
            )
            .sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
          const placed = new Set();
          const visiting = new Set();
          const visit = (mod, path) => {
            if (placed.has(mod.id)) return;
            if (visiting.has(mod.id)) {
              cycles.push([...path.slice(path.indexOf(mod.id)), mod.id]);
              return;
            }
            visiting.add(mod.id);
            const targets = (mod.loadAfter || []).filter(
              (t) => t !== "*" && activeIds.has(t),
            );
            targets.forEach((targetId) => {
              const target = members.find((m) => m.id === targetId);
              if (target) visit(target, [...path, mod.id]);
            });
            visiting.delete(mod.id);
            placed.add(mod.id);
            phases[phase].push({
              mod,
              reason: targets.length
                ? "after"
                : phase === "late"
                  ? "late"
                  : "alpha",
              after: targets,
            });
          };
          members.forEach((mod) => visit(mod, []));
        });
        return { phases, cycles };
      }

        if (issues.some((i) => i.kind === "incompatible"))
          stamps.push('<span class="stamp err">Conflict</span>');
        if (issues.some((i) => i.kind === "deprecated"))
          stamps.push('<span class="stamp warn">Deprecated</span>');
        if (issues.some((i) => i.kind === "dlc"))
          stamps.push('<span class="stamp warn">DLC</span>');
        if (mod.update)
          stamps.push(`<span class="stamp accent">Update ${mod.update}</span>`);

          stamps.push('<span class="stamp late">Late</span>');

          stamps.push('<span class="stamp dim">Local</span>');
        if (!stamps.length && mod.active)
          stamps.push('<span class="stamp ok">OK</span>');

      function renderDetail() {
        const mod = modById(state.selected) || installedMods()[0];
        if (!mod) return `<aside class="detail"></aside>`;
        const issues = issuesFor(mod);
        const locked = isWriteLocked();
        const depRow = (id, kind) => {
          const dep = modById(id);
          const isOn = dep && dep.active;
          let dotClass = isOn ? "ok" : "err";
          if (kind === "Incompatible") dotClass = isOn ? "err" : "ok";
          if (kind === "Optional" || kind === "Load after")
            dotClass = isOn ? "ok" : "";
          if (kind === "Deprecates") dotClass = "";
          return `<li><span class="dot ${dotClass}"></span><span>${dep ? escapeHtml(dep.name) : `<span class="data">${id}</span>`}</span><span class="kind stamp dim">${kind}</span></li>`;

          ...(mod.requires || []).map((d) => depRow(d, "Requires")),
          ...(mod.optional || []).map((d) => depRow(d, "Optional")),
          ...(mod.loadAfter || [])
            .filter((d) => d !== "*")

          ...(mod.incompatible || []).map((d) => depRow(d, "Incompatible")),

      function renderOrder() {
        const view = $("#view-order");
        const { phases, cycles } = computeLoadOrder();
        let position = 0;
        const row = (entry) => {
          position += 1;
          const mod = entry.mod;
          const why =
            entry.reason === "after"
              ? `Loads after <b>${entry.after.map((id) => escapeHtml(modLabel(id))).join("</b>, <b>")}</b> (LoadAfter)`
              : entry.reason === "late"
                ? `Late phase: <span class="data">LoadAfter: ["*"]</span>`
                : "No rule, so it falls back to alphabetical order. Don't rely on this.";
          return `<div class="order-row"><span class="pos">${String(position).padStart(2, "0")}</span><div><span class="mod-cat">[${escapeHtml(mod.cat)}]</span><span class="mod-name">${escapeHtml(mod.name)}</span><div class="why">${why}</div></div>${entry.reason === "late" ? '<span class="stamp late">Late</span>' : ""}</div>`;
        };
        const cycleHtml = cycles.length
          ? `<div class="callout err">${icon("alert")}<div><b>LoadAfter loop.</b> ${cycles.map((cycle) => cycle.map((id) => escapeHtml(modLabel(id))).join(" → ")).join("; ")}. The game's order for these mods is undefined. Ask the author to fix it, or turn one of them off.</div></div>`
          : "";
        const body = installedMods().length

      function renderDownloads() {
        const view = $("#view-downloads");
        const statusLabel = {
          downloading: (item) => `Downloading · ${item.pct}%`,
          verifying: () => "Verifying md5",
          done: () => "Installed · md5 verified",
          failed: () => "Failed: md5 didn't match, so nothing was installed",
        };
        const rows = state.queue
          .map((item, index) => {
            const barClass =
              item.status === "failed"
                ? "err"
                : item.status === "done"
                  ? "ok"
                  : "";
            const fill =
              item.status === "failed" || item.status === "done"
                ? 1
                : item.pct / 100;
            const action =
              item.status === "failed"
                ? `<button class="btn" data-action="retry" data-idx="${index}">${icon("refresh")}Retry</button>`
                : item.status === "done"
                  ? `<button class="btn ghost" data-action="nav" data-view="library">Show</button>`
                  : `<button class="btn ghost" data-action="cancel-dl" data-idx="${index}">Cancel</button>`;
            return `<div class="queue-row"><div><span class="mod-name">${escapeHtml(item.name)}</span><span class="mod-id"><span class="data">${item.size}</span> · ${statusLabel[item.status](item)}</span></div><div class="bar ${barClass}" role="progressbar" aria-valuenow="${Math.round(fill * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${escapeHtml(item.name)}"><span style="transform:scaleX(${fill})"></span></div>${action}</div>`;

      function renderTweaks() {
        const view = $("#view-tweaks");
        const tweakable = installedMods().filter((mod) => mod.options);
        if (!tweakable.find((mod) => mod.id === state.tweakMod))
          state.tweakMod = tweakable[0] && tweakable[0].id;
        const groups = TWEAK_GROUPS[state.tweakMod] || [];
        const control = (opt) => {
          const id = `opt-${opt.key}`;
          if (opt.type === "toggle")
            return `<button class="toggle" role="switch" id="${id}" aria-checked="${opt.value}" data-action="tweak-toggle" data-key="${opt.key}"></button>`;
          if (opt.type === "enum")
            return `<label class="field"><select id="${id}" data-tweak="${opt.key}">${opt.values.map((v) => `<option ${v === opt.value ? "selected" : ""}>${v}</option>`).join("")}</select></label>`;
          if (opt.type === "slider")
            return `<div style="display:flex;gap:10px;align-items:center"><input type="range" id="${id}" min="${opt.min}" max="${opt.max}" step="${opt.step}" value="${opt.value}" data-tweak="${opt.key}" /><span class="data" style="min-width:44px;text-align:right" id="${id}-v">${opt.value}${opt.unit}</span></div>`;
          if (opt.type === "text")
            return `<label class="field"><input id="${id}" value="${escapeHtml(opt.value)}" data-tweak="${opt.key}" /></label>`;
          return `<input type="color" id="${id}" value="${opt.value}" data-tweak="${opt.key}" />`;
        };
        const optionRow = (opt) =>
          `<div class="opt"><label for="opt-${opt.key}">${escapeHtml(opt.label)}${opt.value !== opt.def ? '<span class="modified">modified</span>' : ""}${opt.hint ? `<span class="hint">${escapeHtml(opt.hint)}</span>` : ""}</label>${control(opt)}<button class="btn ghost" data-action="tweak-reset" data-key="${opt.key}" aria-label="Reset ${escapeHtml(opt.label)}">Reset</button></div>`;
        const body = tweakable.length
          ? `<div class="tweak-layout"><nav class="tweak-mods" aria-label="Mods with options">${tweakable.map((mod) => `<button data-action="tweak-mod" data-id="${mod.id}" aria-current="${state.tweakMod === mod.id}">${escapeHtml(mod.name)}</button>`).join("")}</nav>
             <div>${groups.map((g) => `<details class="group" ${g.open ? "open" : ""}><summary>${icon("chevron")}${escapeHtml(g.group)}</summary>${g.opts.map(optionRow).join("")}</details>`).join("")}</div></div>`
          : '<p class="muted">None of your installed mods expose options.</p>';
        view.innerHTML = `<div class="view-head"><div><h1 id="h-tweaks">Tweaks</h1><p>Options that mod authors expose. Values are saved to <span class="data">mods\\active-options.jsonc</span> and apply the next time the game starts.</p></div>

          <div class="scroll">${body}</div>`;
      }

        });
        const checks = [
          [
            "ok",
            "Game found",
            `${is1800 ? "Steam" : "Ubisoft Connect"} · <code>${is1800 ? "D:\\SteamLibrary\\steamapps\\common\\Anno 1800" : "C:\\Program Files (x86)\\Ubisoft\\Ubisoft Game Launcher\\games\\Anno 117 - Pax Romana"}</code>`,
          ],
          [
            "ok",
            "Mods folder writable",
            `<code>${escapeHtml(currentGame().modsPath)}</code>`,

          is1800

                "Old mod loader file found",
                "<code>Bin\\Win64\\python35.dll</code> is from the pre-GU17 loader and can stop mods loading. Verify game files in your launcher to restore the original.",

                "ok",
                "Profile format",
                "Newer <code>profile.txt</code> + <code>profiles\\</code> layout detected",

                "warn",
                "Mod in two places",

              ]
            : ["ok", "No duplicate ModIDs", "Every ModID appears once"],
        ];
        const log = is1800
          ? "[12:41:08] mod-loader: loading 10 mods\n[12:41:08] [error] skyscraper-tiers-otis: DLC dependency 'SeatOfPower' not owned\n[12:41:09] [warn] pier-lighting-telford: LoadAfter cycle with street-lamps-davy\n[12:41:09] [error] railway-overhaul-stephenson: assets.xml ModOp Path not found (line 214)\n[12:41:10] mod-loader: done in 2.1s"
          : "[20:14:02] mod-loader: loading 11 mods (profile: Default)\n[20:14:02] [error] harbour-expansion-cassius: missing dependency aqueduct-core-felix\n[20:14:02] [warn] old-harbour-fix-cassius: deprecated by harbour-expansion-cassius, skipped\n[20:14:03] [error] legion-economy-marcus: incompatible with relaxed-economy-junia\n[20:14:04] mod-loader: done in 1.7s";
        const parsedLog = log

            .join("") ||
          `<div class="check-row">${icon("check", "ic-ok")}<div class="grow">No conflicts or missing dependencies.</div></div>`;

          <div class="actions"><button class="btn" data-action="toast" data-msg="Checks re-run. Nothing new.">${icon("refresh")}Re-run checks</button><button class="btn ghost" data-action="toast" data-msg="Log copied to clipboard">Copy log</button></div></div>
          <div class="scroll"><div class="health-grid">
            <section class="panel"><h2>${icon("alert")}Active mod set <span class="muted" style="margin-left:auto;font-weight:400">${uniqueIssues.length} issue${uniqueIssues.length === 1 ? "" : "s"}</span></h2>${issueRows}</section>
            <section class="panel"><h2>${icon("settings")}Environment</h2>${checks.map(([level, title, body]) => `<div class="check-row">${icon(level === "ok" ? "check" : "alert", "ic-" + level)}<div class="grow"><b>${title}</b><div>${body}</div></div></div>`).join("")}</section>
            <section class="panel"><h2>${icon("health")}mod-loader.log, parsed</h2>${parsedLog}</section>
            <section class="panel"><h2>Raw log <span class="muted data" style="margin-left:auto;font-weight:400">${escapeHtml(currentGame().logPath)}</span></h2><pre class="raw">${escapeHtml(log)}</pre></section>

      // ---------- Toasts ----------
      function toast(message, kind = "ok") {
        const el = document.createElement("div");
        el.className = `toast ${kind}`;
        el.innerHTML = `${icon(kind === "ok" ? "check" : "alert")}<div>${escapeHtml(message)}</div>`;
        $("#toasts").appendChild(el);
        setTimeout(() => {
          el.classList.add("leaving");
          setTimeout(() => el.remove(), 180);
        }, 3600);
      }

      function openDrawer(data) {
        const installed = currentGame().mods.find((mod) => mod.id === data.id);
        const blocked = isWriteLocked() || state.mock.offline;
        drawerReturnFocus = document.activeElement;
        $("#drawer").innerHTML =
          `<div class="drawer-head"><h2 id="drawerTitle">${escapeHtml(data.name)}</h2><button class="btn ghost" data-action="close-drawer" aria-label="Close">${icon("x")}</button></div>
          <div class="drawer-body"><div class="gallery"><div></div><div></div><div></div></div>
            <p class="byline">by ${escapeHtml(data.by)} · ${data.cat} · <span class="data">${data.size}</span> · ${data.rating} rating · ${data.dl} downloads</p>
            <p>A ${data.cat.toLowerCase()} mod for ${escapeHtml(currentGame().fullName)}. The full mod.io description, changelog and media appear here.</p>
            <h3 class="label-h">Dependencies</h3>
            <ul class="dep-list"><li><span class="dot ok"></span>Shared UI Library<span class="kind stamp ok">Installed</span></li></ul>
            <h3 class="label-h">Your rating</h3>
            <div class="btn-row"><button class="btn" data-action="toast" data-msg="Rated up" ${state.mock.signedOut ? "disabled" : ""}>${icon("star")}Good</button><button class="btn ghost" data-action="toast" data-msg="Report sent to mod.io" data-kind="warn">Report</button></div>
            ${state.mock.signedOut ? '<p class="muted" style="font-size:12px;margin-top:8px">Sign in to rate or subscribe. Guests can still install.</p>' : ""}
          </div>
          <div class="drawer-foot"><span class="powered" style="margin-right:auto;align-self:center">Powered by mod.io</span>
            <button class="btn ghost" data-action="toast" data-msg="Opened the mod.io page">View on mod.io</button>
            ${installed ? `<button class="btn" disabled>${icon("check")}Installed</button>` : `<button class="btn primary" data-action="subscribe" data-name="${escapeHtml(data.name)}" data-size="${data.size}" ${blocked ? "disabled" : ""}>${icon("download")}${state.mock.signedOut ? "Install" : "Subscribe & install"}</button>`}</div>`;
        $("#drawer").classList.add("on");
        $("#drawer").setAttribute("aria-hidden", "false");
        $("#scrim").classList.add("on");
        $("#drawer .drawer-head button").focus();
      }
      function closeDrawer() {
        if (!$("#drawer").classList.contains("on")) return;
        $("#drawer").classList.remove("on");
        $("#drawer").setAttribute("aria-hidden", "true");
        $("#scrim").classList.remove("on");
        if (drawerReturnFocus && document.contains(drawerReturnFocus))
          drawerReturnFocus.focus();
      }

      // ---------- Download simulation ----------
      let downloadTimer = null;
      function enqueue(name, size) {
        state.queue.unshift({ name, size, pct: 0, status: "downloading" });
        runDownloads();
      }
      function runDownloads() {
        if (downloadTimer) return;
        downloadTimer = setInterval(() => {
          let busy = false;
          state.queue.forEach((item) => {
            if (item.status === "downloading") {
              busy = true;
              item.pct = Math.min(
                100,
                item.pct + 9 + Math.round(Math.random() * 8),
              );
              if (item.pct >= 100) item.status = "verifying";
            } else if (item.status === "verifying") {
              busy = true;
              item.status = "done";
              toast(`${item.name} installed and verified`);
            }
          });
          if (state.view === "downloads") renderDownloads();
          renderNav();
          if (!busy) {
            clearInterval(downloadTimer);
            downloadTimer = null;
          }
        }, 450);
      }

      // ---------- Drop + install preview ----------
      function openPreview(kind) {
        const dialog = $("#previewDlg");
        const game = currentGame();
        const other = state.game === "a117" ? GAMES.a1800 : GAMES.a117;
        const check = (level, text) =>
          `<li>${icon(level === "ok" ? "check" : "alert", "ic-" + level)}<span>${text}</span></li>`;
        let title;
        let installLabel = "";
        let items;
        if (kind === "wrong") {
          title = "1 mod found in exact-numbers-babbage.zip";
          items = `<div class="preview-item"><header><div class="grow"><span class="mod-cat">[UI]</span><span class="mod-name">Exact Numbers</span><span class="mod-id data">exact-numbers-babbage · 5.0.0</span></div><span class="stamp err">Wrong game</span></header>
            <ul class="preview-checks">${check("err", `Built for <b>${other.label}</b> (modinfo <span class="data">"Anno": ${state.game === "a117" ? 7 : 8}</span>). ${game.label} won't load it.`)}${check("ok", "Archive is valid, with no unsafe paths")}</ul>
            <div class="callout-actions" style="margin-top:12px"><button class="btn primary" data-action="switch-install">Install for ${other.label} instead</button></div></div>`;
        } else {
          title = "Found 3 mods and 1 sub-mod in roman-pack-v2.zip";
          installLabel = "Install 2 mods";
          items = `
            <div class="preview-item"><header><div class="grow"><span class="mod-cat">[Gameplay]</span><span class="mod-name">Aqueduct Core</span><span class="mod-id data">aqueduct-core-felix · 1.2.0</span></div><span class="stamp ok">New</span></header>
              <ul class="preview-checks">${check("ok", `For ${GAMES.a117.label}`)}${check("ok", "Fixes a missing dependency of Harbour Expansion")}${check("ok", `Installs to <span class="data">mods\\aqueduct-core-felix</span>`)}${check("ok", "Includes sub-mod: Aqueduct Core · Visuals")}</ul></div>
            <div class="preview-item"><header><div class="grow"><span class="mod-cat">[Gameplay]</span><span class="mod-name">Roads of Latium</span><span class="mod-id data">roads-of-latium-octavia · 1.4.2 → 1.5.0</span></div><span class="stamp accent">Update</span></header>
              <ul class="preview-checks">${check("ok", "Same ModID, newer version")}${check("ok", "Stays active; 1.4.2 is backed up")}${check("warn", "Not safe to remove from an existing save")}</ul></div>
            <div class="preview-item"><header><div class="grow"><span class="mod-cat">[Cosmetic]</span><span class="mod-name">Grand Forum Pack</span><span class="mod-id data">grand-forum-pack-livia · 3.0.0 → 2.6.1</span></div><span class="stamp warn">Downgrade</span></header>
              <ul class="preview-checks">${check("warn", "Older than the installed 3.0.0, so it's skipped")}${check("ok", "Archive is valid, with no unsafe paths")}</ul>
              <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px"><input type="checkbox" style="accent-color:var(--accent)" /> Install the older version anyway</label></div>`;
        }
        const lockNotice = isWriteLocked()
          ? `<div class="callout err">${icon("lock")}<div>${game.exe} is running. Close the game to install. This preview stays open.</div></div>`
          : "";
        dialog.innerHTML = `<div class="drawer-head"><h2 id="previewTitle">${title}</h2><button class="btn ghost" data-action="close-preview" aria-label="Close">${icon("x")}</button></div>
          <div class="dlg-body">${lockNotice}${items}</div>
          <div class="drawer-foot"><span class="muted" style="margin-right:auto;align-self:center;font-size:12px">Nothing has been written yet.</span><button class="btn ghost" data-action="close-preview">Cancel</button>${installLabel ? `<button class="btn primary" data-action="confirm-install" ${isWriteLocked() ? "disabled" : ""}>${icon("download")}${installLabel}</button>` : ""}</div>`;
        dialog.showModal();
      }
      function showDropzone(visible) {
        $("#dropzone").classList.toggle("on", visible);
        $("#dropzone").setAttribute("aria-hidden", String(!visible));
      }

      // ---------- First-run wizard ----------
      let wizardStep = 0;
      const WIZARD_STEPS = [
        {
          title: "Welcome to Atelier",
          body: () => `<p>We found these games on this PC. Pick the ones to manage. You can add more later.</p>
            <div class="found">${icon("check", "ic-ok")}<div class="grow"><b>Anno 117: Pax Romana</b><div class="muted data">Ubisoft Connect · C:\\Program Files (x86)\\Ubisoft\\…\\Anno 117 - Pax Romana</div></div><button class="toggle" role="switch" aria-checked="true" aria-label="Manage Anno 117" data-action="press-switch"></button></div>
            <div class="found">${icon("check", "ic-ok")}<div class="grow"><b>Anno 1800</b><div class="muted data">Steam · D:\\SteamLibrary\\steamapps\\common\\Anno 1800</div></div><button class="toggle" role="switch" aria-checked="true" aria-label="Manage Anno 1800" data-action="press-switch"></button></div>
            <button class="btn ghost">${icon("folder")}Add a game folder manually</button>`,
        },
        {
          title: "Where should mods go?",
          body: () => `<p>Documents folders need no admin rights and survive game reinstalls. We recommend them.</p>
            <div class="found"><div class="grow"><b>Anno 117</b><div class="muted data">${escapeHtml(GAMES.a117.modsPath)}</div></div><span class="stamp ok">Writable</span></div>
            <div class="found"><div class="grow"><b>Anno 1800</b><div class="muted data">${escapeHtml(GAMES.a1800.modsPath)}</div></div><span class="stamp ok">Writable</span></div>
            <div class="callout info">${icon("info")}<div>Atelier found 22 mods already installed and will keep their on/off state.</div></div>`,
        },
        {
          title: "Connect mod.io",
          body: () => `<p>Optional. Sign in to subscribe, rate and sync subscriptions across devices. You can skip this and still browse and install.</p>
            <div class="auth-options"><button class="auth-option" data-action="wiz-next">${icon("browse")}<div><strong>Sign in with mod.io</strong><span>Opens your browser</span></div></button><button class="auth-option" data-action="wiz-next">${icon("user")}<div><strong>Use a device code</strong><span>Enter a code at mod.io/connect</span></div></button></div>`,
        },
        {
          title: "You're set",
          body: () => `<p>Drop any mod archive on the window to install it, or browse mod.io. Atelier checks every change before you launch.</p>
            <div class="callout info">${icon("lock")}<div>While a game is running, Atelier locks the mods folder so nothing changes mid-session.</div></div>`,
        },
      ];
      function renderWizard() {
        const step = WIZARD_STEPS[wizardStep];
        const isLast = wizardStep === WIZARD_STEPS.length - 1;
        $("#wizardDlg").innerHTML =
          `<ol class="steps" aria-label="Step ${wizardStep + 1} of ${WIZARD_STEPS.length}">${WIZARD_STEPS.map((_, i) => `<li class="${i <= wizardStep ? "done" : ""}"></li>`).join("")}</ol>
          <div class="drawer-head" style="border:0"><h2 id="wizardTitle">${step.title}</h2></div><div class="dlg-body" style="padding-top:0">${step.body()}</div>
          <div class="drawer-foot">${wizardStep > 0 ? '<button class="btn ghost" data-action="wiz-back" style="margin-right:auto">Back</button>' : ""}${wizardStep === 2 ? '<button class="btn ghost" data-action="wiz-next">Skip for now</button>' : ""}
          <button class="btn primary" data-action="${isLast ? "wiz-done" : "wiz-next"}">${isLast ? "Open Atelier" : "Continue"}</button></div>`;
      }

      // ---------- Actions ----------
      const findOption = (key) =>
        (TWEAK_GROUPS[state.tweakMod] || [])
          .flatMap((g) => g.opts)
          .find((opt) => opt.key === key);
      function applyUpdate(mod) {
        enqueue(mod.name, `${mod.size} MB`);
        mod.ver = mod.update;
        delete mod.update;
      }
      const ACTIONS = {
        nav: (d) => {
          state.view = d.view;
          closeDrawer();
          render();
        },
        game: (d) => {
          state.game = d.game;
          const firstWithIssue = currentGame().mods.find(
            (mod) => issuesFor(mod).length,
          );
          state.selected = (firstWithIssue || currentGame().mods[0]).id;
          state.profile = "Default";
          state.filter = "all";
          render();
        },
        select: (d, e) => {
          if (!e.target.closest(".toggle")) {
            state.selected = d.id;
            renderLibrary();
          }
        },
        "toggle-mod": (d) => {
          const mod = modById(d.id);
          mod.active = !mod.active;
          state.selected = mod.id;
          toast(`${mod.name} ${mod.active ? "activated" : "deactivated"}`);
          render();
        },
        filter: (d) => {
          state.filter = d.filter;
          renderLibrary();
        },
        "clear-filter": () => {
          state.filter = "all";
          state.query = "";
          renderLibrary();
        },
        "install-dep": () => {
          enqueue("Aqueduct Core", "31 MB");
          toast("Installing Aqueduct Core from mod.io");
          state.view = "downloads";
          render();
        },
        "activate-dep": (d) => {
          modById(d.dep).active = true;
          render();
        },
        deactivate: (d) => {
          modById(d.id).active = false;
          toast(`${modById(d.id).name} turned off`);
          render();
        },
        update: (d) => {
          const mod = modById(d.id);
          applyUpdate(mod);
          toast(`Updating ${mod.name}`);
          render();
        },
        "update-all": () => {
          currentGame()
            .mods.filter((mod) => mod.update)
            .forEach(applyUpdate);
          render();
        },
        "open-tweaks": (d) => {
          state.tweakMod = d.id;
          state.view = "tweaks";
          render();
        },
        "tweak-mod": (d) => {
          state.tweakMod = d.id;
          renderTweaks();
        },
        "tweak-toggle": (d) => {
          const opt = findOption(d.key);
          opt.value = !opt.value;
          renderTweaks();
        },
        "tweak-reset": (d) => {
          const opt = findOption(d.key);
          opt.value = opt.def;
          renderTweaks();
          toast(`${opt.label} reset`);
        },
        "goto-mod": (d) => {
          state.selected = d.id;
          state.view = "library";
          state.filter = "all";
          render();
        },
        "open-mod": (d) => openDrawer(d),
        "close-drawer": () => closeDrawer(),
        subscribe: (d) => {
          enqueue(d.name, d.size);
          closeDrawer();
          toast(`${d.name} queued`);
          state.view = "downloads";
          render();
        },
        "install-collection": (d) => {
          toast(
            `Installing ${d.n} mods from ${d.name}. Profile “${d.name}” created.`,
          );
          if (!currentGame().profiles.includes(d.name))
            currentGame().profiles.push(d.name);
          state.profile = d.name;
          render();
        },
        retry: (d) => {
          Object.assign(state.queue[d.idx], { status: "downloading", pct: 0 });
          runDownloads();
          renderDownloads();
        },
        "cancel-dl": (d) => {
          state.queue.splice(Number(d.idx), 1);
          renderDownloads();
          renderNav();
        },
        "simulate-drop": (d) => {
          $("#mockMenu").classList.remove("on");
          showDropzone(true);
          setTimeout(() => {
            showDropzone(false);
            openPreview(d.kind);
          }, 650);
        },
        "close-preview": () => $("#previewDlg").close(),
        "confirm-install": () => {
          $("#previewDlg").close();
          const game = GAMES.a117;
          if (!game.mods.find((mod) => mod.id === "aqueduct-core-felix")) {
            game.mods.push({
              id: "aqueduct-core-felix",
              name: "Aqueduct Core",
              cat: "Gameplay",
              ver: "1.2.0",
              author: "Felix",
              size: 31,
              active: true,
              source: "local",
              setup: { safe: false, mp: true },
              desc: "Aqueducts, cisterns and fountains. Installed from a dropped archive.",
            });
          }
          const roads = game.mods.find(
            (mod) => mod.id === "roads-of-latium-octavia",
          );
          if (roads.update) {
            roads.ver = roads.update;
            delete roads.update;
          }
          Object.assign(state, {
            game: "a117",
            view: "library",
            selected: "harbour-expansion-cassius",
          });
          state.mock.empty = false;
          toast("Installed 2 mods. The downgrade was skipped.");
          render();
        },
        "switch-install": () => {
          $("#previewDlg").close();
          state.game = state.game === "a117" ? "a1800" : "a117";
          state.view = "library";
          toast(
            `Switched to ${currentGame().label}. Exact Numbers was already installed here, so nothing changed.`,
          );
          render();
        },
        launch: () => {
          const errors = errorCount();
          toast(
            errors
              ? `Launching with ${errors} known issue${errors > 1 ? "s" : ""}. See Health for details.`
              : `Launching ${currentGame().label}`,
            errors ? "warn" : "ok",
          );
        },
        "mock-menu": () => {
          $("#mockMenu").classList.toggle("on");
          renderStatus();
        },
        mock: (d) => {
          state.mock[d.key] = !state.mock[d.key];
          if (d.key === "signedOut") state.authStep = "idle";
          render();
        },
        "mock-set": (d) => {
          state.mock[d.key] = d.val === "true";
          state.authStep = "idle";
          render();
        },
        "start-signin": () => {
          state.view = "settings";
          state.authStep = "terms";
          render();
        },
        auth: (d) => {
          if (d.step === "done") {
            state.mock.signedOut = false;
            state.authStep = "idle";
            toast("Signed in to mod.io as marcus_builds");
          } else state.authStep = d.step;
          renderSettings();
          renderStatus();
        },
        wizard: () => {
          $("#mockMenu").classList.remove("on");
          wizardStep = 0;
          renderWizard();
          $("#wizardDlg").showModal();
        },
        "wiz-next": () => {
          wizardStep = Math.min(WIZARD_STEPS.length - 1, wizardStep + 1);
          renderWizard();
        },
        "wiz-back": () => {
          wizardStep = Math.max(0, wizardStep - 1);
          renderWizard();
        },
        "wiz-done": () => {
          $("#wizardDlg").close();
          toast("Setup complete");
        },
        press: (d, e, el) =>
          el.setAttribute(
            "aria-pressed",
            String(el.getAttribute("aria-pressed") !== "true"),
          ),
        "press-switch": (d, e, el) =>
          el.setAttribute(
            "aria-checked",
            String(el.getAttribute("aria-checked") !== "true"),
          ),
        toast: (d) => toast(d.msg, d.kind || "ok"),
        noop: (d, e) => e.preventDefault(),
      };

      // ---------- Events ----------
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (
          !e.target.closest("#mockMenu") &&
          !(el && el.dataset.action === "mock-menu")
        )
          $("#mockMenu").classList.remove("on");
        if (!el) return;
        const handler = ACTIONS[el.dataset.action];
        if (handler) handler(el.dataset, e, el);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeDrawer();
          $("#mockMenu").classList.remove("on");
          showDropzone(false);
        }
        const row = e.target.closest && e.target.closest("tr.row");
        if (row && e.target === row && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          state.selected = row.dataset.id;
          renderLibrary();
          $(`tr.row[data-id="${row.dataset.id}"]`).focus();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "libSearch") {
          state.query = e.target.value;
          const caret = e.target.selectionStart;
          renderLibrary();
          const search = $("#libSearch");
          search.focus();
          search.setSelectionRange(caret, caret);
        }
        if (e.target.dataset.tweak) {
          const opt = findOption(e.target.dataset.tweak);
          opt.value =
            opt.type === "slider" ? Number(e.target.value) : e.target.value;
          const readout = $(`#opt-${opt.key}-v`);
          if (readout) readout.textContent = `${opt.value}${opt.unit}`;
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "profileSel") {
          state.profile = e.target.value;
          toast(`Switched to profile “${state.profile}”`);
          render();
        }
        if (e.target.dataset.tweak) renderTweaks();
      });

      // Real drag-and-drop: any file dragged over the window opens the drop target.
      let dragDepth = 0;
      window.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragDepth += 1;
        showDropzone(true);
      });
      window.addEventListener("dragover", (e) => e.preventDefault());
      window.addEventListener("dragleave", () => {
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) showDropzone(false);
      });
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        dragDepth = 0;
        showDropzone(false);
        const fileName =
          e.dataTransfer && e.dataTransfer.files[0]
            ? e.dataTransfer.files[0].name
            : "";
        openPreview(/1800|babbage/i.test(fileName) ? "wrong" : "multi");
      });

      render();
    </script>
  </body>
</html>
