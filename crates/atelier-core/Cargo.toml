[package]
name = "atelier-core"
description = "Game detection, modinfo parsing, scanning, activation, load order, issues and health for Anno 117 and Anno 1800."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
encoding_rs = "0.8"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
