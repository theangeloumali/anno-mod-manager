[package]
name = "atelier-modio"
description = "mod.io REST client: auth, browse, subscriptions, downloads with md5 checks, and update checks."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
atelier-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "form", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
md-5 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"

[package.metadata.cargo-machete]
# The md-5 package is imported as `md5` (download.rs), which machete reads as unused.
ignored = ["md-5"]
