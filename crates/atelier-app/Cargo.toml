[package]
name = "atelier-app"
description = "App state behind the Tauri commands: games, mods, installs, mod.io and settings, with no Tauri dependency."
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[dependencies]
atelier-core = { workspace = true }
atelier-modio = { workspace = true }
atelier-install = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
url = "2"
# Same features as atelier-modio's and lzma-rust2's copies, so no new crates are built.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "form", "stream"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
md-5 = "0.10"
socket2 = "0.6"
